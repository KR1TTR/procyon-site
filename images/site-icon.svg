<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Website icon: the Procyon raccoon on a night-blue tile, so the
       website's browser tab looks different from the Procyon program's. -->
  <rect width="32" height="32" rx="7" fill="#24408f"/>
  <g transform="translate(3.2 3.6) scale(.8)">
<defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ears -->
  <path d="M4.2 13.2 5.6 3.6 13 8.4Z" fill="#aab6cc"/>
  <path d="M27.8 13.2 26.4 3.6 19 8.4Z" fill="#aab6cc"/>
  <path d="M6.2 10.6 7 6.2 10.6 8.6Z" fill="#141b2e"/>
  <path d="M25.8 10.6 25 6.2 21.4 8.6Z" fill="#141b2e"/>
  <!-- head, narrowing to the snout -->
  <path d="M16 6.6c6.6 0 11.7 3.7 12.6 8.9.7 4-2.1 6.6-5.6 8.7l-5.4 4.6a2.4 2.4 0 0 1-3.2 0L9 24.2c-3.5-2.1-6.3-4.7-5.6-8.7C4.3 10.3 9.4 6.6 16 6.6Z" fill="#c9d3e6"/>
  <!-- forehead stripe -->
  <path d="M16 7.4 14.7 12.6h2.6Z" fill="#7f8ba3"/>
  <!-- the bandit mask -->
  <path d="M3.6 16.1c2.1-3.7 6.9-4.2 10-1.3L16 17l2.4-2.2c3.1-2.9 7.9-2.4 10 1.3-1.6 3.6-6.2 4.7-9.3 3.1L16 20.7l-3.1-1.5c-3.1 1.6-7.7.5-9.3-3.1Z" fill="#0b1020"/>
  <!-- white muzzle and nose -->
  <path d="M11.6 21.2Q16 19.4 20.4 21.2l-2.6 6.5a2.4 2.4 0 0 1-3.6 0Z" fill="#eef2f8"/>
  <ellipse cx="16" cy="26.4" rx="1.6" ry="1.1" fill="#0b1020"/>
  <!-- the eyes: Procyon A and Procyon B -->
  <circle cx="9.6" cy="16.3" r="3.2" fill="url(#glow)"/>
  <circle cx="22.4" cy="16.3" r="3.2" fill="url(#glow)"/>
  <path d="M9.6 12.9 10.5 15.4 13 16.3 10.5 17.2 9.6 19.7 8.7 17.2 6.2 16.3 8.7 15.4Z" fill="#fff4c2"/>
  <path d="M22.4 12.9 23.3 15.4 25.8 16.3 23.3 17.2 22.4 19.7 21.5 17.2 19 16.3 21.5 15.4Z" fill="#fff4c2"/>
  </g>
</svg>
